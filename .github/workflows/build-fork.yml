# Fork-only workflow (appsome/cascade) — intentionally not upstreamed.
# Builds the three service images on push to main and pushes them to the
# fork's own GHCR namespace. Upstream's deploy.yml is inert here (self-hosted
# runner + mongrel-intelligence GHCR namespace + upstream infra deploy).
name: Build Fork Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ROUTER_IMAGE: ghcr.io/appsome/cascade-router
  WORKER_IMAGE: ghcr.io/appsome/cascade-worker
  DASHBOARD_IMAGE: ghcr.io/appsome/cascade-dashboard
  MIGRATOR_IMAGE: ghcr.io/appsome/cascade-migrator

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push router image
        run: |
          docker build \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -f Dockerfile.router \
            -t ${{ env.ROUTER_IMAGE }}:main \
            -t ${{ env.ROUTER_IMAGE }}:main-${{ github.sha }} .
          docker push ${{ env.ROUTER_IMAGE }}:main
          docker push ${{ env.ROUTER_IMAGE }}:main-${{ github.sha }}

      - name: Build worker image
        run: |
          docker build \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -f Dockerfile.worker \
            -t ${{ env.WORKER_IMAGE }}:main \
            -t ${{ env.WORKER_IMAGE }}:main-${{ github.sha }} .

      - name: Verify worker runtime tools
        run: WORKER_IMAGE=${{ env.WORKER_IMAGE }}:main-${{ github.sha }} tests/docker/worker-runtime-tools/run-test.sh

      - name: Push worker image
        run: |
          docker push ${{ env.WORKER_IMAGE }}:main
          docker push ${{ env.WORKER_IMAGE }}:main-${{ github.sha }}

      # Dashboard uses Dockerfile.selfhosted (not Dockerfile.dashboard): the
      # upstream dashboard image is API-only — upstream serves the frontend
      # from Cloudflare Pages. Self-hosted mode builds the Vite frontend into
      # dist/web/ so dashboard.ts serves the SPA at / on the same origin
      # (VITE_API_URL stays unset → frontend calls /trpc relative).
      - name: Build and push dashboard image (self-hosted, with frontend)
        run: |
          docker build \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -f Dockerfile.selfhosted \
            --target production \
            -t ${{ env.DASHBOARD_IMAGE }}:main \
            -t ${{ env.DASHBOARD_IMAGE }}:main-${{ github.sha }} .
          docker push ${{ env.DASHBOARD_IMAGE }}:main
          docker push ${{ env.DASHBOARD_IMAGE }}:main-${{ github.sha }}

      # One-shot migration runner (drizzle-kit migrate against DATABASE_URL).
      # Run once per deploy before starting router/dashboard.
      - name: Build and push migrator image
        run: |
          docker build \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            -f Dockerfile.selfhosted \
            --target migrator \
            -t ${{ env.MIGRATOR_IMAGE }}:main \
            -t ${{ env.MIGRATOR_IMAGE }}:main-${{ github.sha }} .
          docker push ${{ env.MIGRATOR_IMAGE }}:main
          docker push ${{ env.MIGRATOR_IMAGE }}:main-${{ github.sha }}
